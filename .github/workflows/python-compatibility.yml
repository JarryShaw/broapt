name: "Python Compatibility"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 4 * * 6'

permissions:
  contents: read

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        experimental:
          - false
        include:
          - python-version: "3.15"
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Flask file-magic pandas PyYAML requests

      - name: Verify source compatibility
        run: |
          python -m compileall -q \
            source/client/python \
            source/server/python \
            cluster/app/source/python \
            cluster/core/source/python \
            cluster/daemon/python
          python -c 'import flask, magic, pandas, requests, yaml; print("imports ok")'
